# NOE Compiler（NeuralONE）量化编译配置模板
# 用法： bash scripts/quantize_cix.sh -c configs/build.cfg -m models/yolov8n.onnx

[model]
name = yolov8n
onnx = models/yolov8n.onnx
output = models/yolov8n.cix

[input]
# 与训练时保持一致，导出阶段已用 onnxsim 固化 shape
shape = 1,3,640,640
layout = NCHW
mean = 0.0,0.0,0.0
std = 255.0,255.0,255.0

[quantize]
# INT8 用于检测与深度模型；精度不足时改为 INT16
precision = INT8
calibration_dir = calibration/
calibration_samples = 200

[compile]
# 目标平台：此芯 CIX P1（Orion O6 系列）
target = cix_p1
optimize_level = 2
